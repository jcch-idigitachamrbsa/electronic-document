<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>بوابة خدمات غرفة جدة</title>
    <style>
        :root {
            --header-bg: linear-gradient(-130deg, #4062ad 20.17%, #0a925d 77.86%);
            --details-bg: #e9eaec;
            --text-color: #272b2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header Logo Bar */
        .top-bar {
            background: var(--header-bg);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .top-bar svg {
            height: 40px;
            width: 40px;
        }

        /* Document Details Section */
        .request-details {
            background-color: var(--details-bg);
            padding: 20px 30px;
            border-bottom: 1px solid #ccc;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-item label {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .info-item p {
            font-size: 0.95rem;
            font-weight: 600;
            color: #212529;
            word-break: break-word;
        }

        /* Clean Mono Toolbar */
        .pdf-toolbar-bar {
            background-color: #f8f9fa;
            border-top: 1px solid #dcdcdc;
            border-bottom: 1px solid #dcdcdc;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
            overflow-x: auto;
        }

        .tb-section {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tb-btn {
            background: #ffffff;
            border: 1px solid #cfd3d8;
            border-radius: 4px;
            min-width: 30px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            color: #333333;
            text-decoration: none;
            cursor: pointer;
        }

        .tb-btn:hover {
            background-color: #e9ecef;
        }

        .tb-btn svg {
            width: 14px;
            height: 14px;
            fill: #444746;
        }

        .tb-select {
            background: #ffffff;
            border: 1px solid #cfd3d8;
            border-radius: 4px;
            height: 28px;
            font-size: 12px;
            padding: 0 4px;
            font-weight: bold;
            color: #333333;
        }

        .tb-page-box {
            width: 40px;
            height: 28px;
            text-align: center;
            border: 1px solid #cfd3d8;
            border-radius: 4px;
            font-size: 12px;
            background: #ffffff;
            font-weight: bold;
            color: #333333;
        }

        /* Document Display Area */
        .document-container {
            flex: 1;
            background-color: #525659;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
        }

        .doc-image {
            max-width: 850px;
            width: 100%;
            height: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            background-color: #ffffff;
            transition: transform 0.2s ease;
        }

        @media (max-width: 600px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Header Logo -->
    <div class="top-bar">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" stroke="white" stroke-width="8"/>
            <path d="M30 50 L45 65 L70 35" stroke="white" stroke-width="8" stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Document Info Panel -->
    <div class="request-details">
        <div class="details-grid">
            <div class="info-item">
                <label>رقم الوثيقة</label>
                <p>12054938</p>
            </div>
            <div class="info-item">
                <label>الرقم الموحد</label>
                <p>7001363451</p>
            </div>
            <div class="info-item">
                <label>تاريخ الإنشاء</label>
                <p>Aug 17, 2026</p>
            </div>
            <div class="info-item">
                <label>حالة الوثيقة</label>
                <p style="color: #198754;">سارية</p>
            </div>
            <div class="info-item" style="grid-column: span 2;">
                <label>اسم المنشأة</label>
                <p>شركة المصانع السعوديه اللبنانيه للشوكولا والسكاكر</p>
            </div>
            <div class="info-item">
                <label>رقم السجل التجاري</label>
                <p>4030049701</p>
            </div>
            <div class="info-item">
                <label>رقم الإشتراك</label>
                <p>23039</p>
            </div>
            <div class="info-item">
                <label>مقدم الطلب</label>
                <p>أحمد محمد عبدالله الزهراني</p>
            </div>
        </div>
    </div>

    <!-- Toolbar Bar with Professional Grey Icons -->
    <div class="pdf-toolbar-bar">
        <div class="tb-section">
            <button class="tb-btn" title="القائمة">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
        </div>

        <div class="tb-section">
            <button class="tb-btn" title="السابق">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <input type="text" class="tb-page-box" value="1/1" readonly>
            <button class="tb-btn" title="التالي">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
        </div>

        <div class="tb-section">
            <a href="document.pdf" download="document.pdf" class="tb-btn" title="تحميل">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
        </div>

        <div class="tb-section">
            <button class="tb-btn" id="btn-zoom-out" title="تصغير">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/></svg>
            </button>
            <select class="tb-select" id="zoom-select">
                <option value="1">100%</option>
                <option value="1.25">125%</option>
                <option value="1.5" selected>150%</option>
            </select>
            <button class="tb-btn" id="btn-zoom-in" title="تكبير">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm-2.5-5h5v1h-5zM9.5 7v5h1V7z"/></svg>
            </button>
        </div>

        <div class="tb-section">
            <button class="tb-btn" id="btn-rotate" title="تدوير">
                <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.45.45-.45 1.18 0 1.63.45.45 1.18.45 1.63 0l1.79-1.79C9.31 19.78 10.61 20.1 12 20.1c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
            </button>
        </div>
    </div>

    <!-- Viewer Area -->
    <div class="document-container">
        <img src="document.png" alt="الوثيقة الإلكترونية" class="doc-image" id="doc-img">
    </div>

    <script>
        const img = document.getElementById('doc-img');
        const zoomSelect = document.getElementById('zoom-select');
        let currentScale = 1;
        let currentRotation = 0;

        function updateTransform() {
            img.style.transform = `scale(${currentScale}) rotate(${currentRotation}deg)`;
        }

        zoomSelect.addEventListener('change', (e) => {
            currentScale = parseFloat(e.target.value);
            updateTransform();
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            currentScale += 0.15;
            updateTransform();
        });

        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            if (currentScale > 0.5) {
                currentScale -= 0.15;
                updateTransform();
            }
        });

        document.getElementById('btn-rotate').addEventListener('click', () => {
            currentRotation = (currentRotation + 90) % 360;
            updateTransform();
        });
    </script>
</body>
</html>
