        .top-bar {
            background: var(--header-bg);
            padding: 12px 24px;
            display: flex;

            justify-content: flex-start;
        }

        .request-details {
            background-color: var(--details-bg);
            padding: 20px 30px;
            border-bottom: 1px solid #ccc;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-item label {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .info-item p {
            font-size: 0.95rem;
            font-weight: 600;
            color: #212529;
            word-break: break-word;
        }

        /* Custom Toolbar - شريط الأدوات */
        .pdf-toolbar {
            background-color: #ffffff;
            border-bottom: 1px solid #dcdcdc;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .toolbar-btn:hover {
            background: #f0f0f0;
        }

        /* PDF Viewer Container */
        .pdf-viewer-container {
            flex: 1;
            background-color: #525659;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        #pdf-canvas {
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            background-color: #ffffff;
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 600px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .pdf-toolbar {
                justify-content: center;
            }
        }
    </style>
</head>
