<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>بوابة خدمات غرفة جدة</title>
    <style>
        :root {
            --primary-bg: #173c59;
            --header-bg: linear-gradient(-130deg, #4062ad 20.17%, #0a925d 77.86%);
            --details-bg: #e9eaec;
            --text-color: #272b2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header Logo Bar */
        .top-bar {
            background: var(--header-bg);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .top-bar img {
            height: 40px;
        }

        /* Details Section */
        .request-details {
            background-color: var(--details-bg);
            padding: 20px 30px;
            border-bottom: 1px solid #ccc;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-item label {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .info-item p {
            font-size: 0.95rem;
            font-weight: 600;
            color: #212529;
        }

        /* PDF Viewer Area */
        .pdf-viewer-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #525659; /* Standard PDF viewer background */
        }

        .pdf-frame {
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-radius: 4px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Header Logo -->
    <div class="top-bar">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" stroke="white" stroke-width="8"/>
            <path d="M30 50 L45 65 L70 35" stroke="white" stroke-width="8" stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Document Info Panel -->
    <div class="request-details">
        <div class="details-grid">
            <div class="info-item">
                <label>رقم الوثيقة</label>
                <p>10608679</p>
            </div>
            <div class="info-item">
                <label>الرقم الموحد</label>
                <p>7042862115</p>
            </div>
            <div class="info-item">
                <label>تاريخ الإنشاء</label>
                <p>Sep 18, 2025</p>
            </div>
            <div class="info-item">
                <label>حالة الوثيقة</label>
                <p style="color: #198754;">سارية</p>
            </div>
            <div class="info-item" style="grid-column: span 2;">
                <label>اسم المنشأة</label>
                <p>مؤسسة إمكان العربية المتحدة للتموين</p>
            </div>
            <div class="info-item">
                <label>رقم السجل التجاري</label>
                <p>4030597128</p>
            </div>
            <div class="info-item">
                <label>رقم الإشتراك</label>
                <p>600722</p>
            </div>
            <div class="info-item">
                <label>مقدم الطلب</label>
                <p>محمد بن يوسف اليوسف</p>
            </div>
        </div>
    </div>

    <!-- Embedded PDF Section -->
    <div class="pdf-viewer-container">
        <!-- تم وضع اسم الملف document.pdf هنا -->
        <embed src="document.pdf" type="application/pdf" class="pdf-frame" />
    </div>

</body>
</html>
